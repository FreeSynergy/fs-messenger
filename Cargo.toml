[workspace]
resolver = "2"
members = ["crates/fs-messenger-core", "crates/fs-messenger-guard", "crates/fs-messenger-mail", "crates/fs-messenger-matrix"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

# Dependencies optimised in debug builds: the invitation-flood test (1000 rooms against a mock server)
# runs in about 0.5 s in release and ran past its 16 s limit unoptimised.
[profile.dev.package."*"]
opt-level = 2
