[package]
name = "fs-messenger-app"
description = "The messenger program of FreeSynergy, window: the generated Admin frontend (ADR 0066) over the core, in the standard window shell (ADR 0065)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
fs-messenger-core = { path = "../fs-messenger-core" }
fs-objects = { git = "https://github.com/FreeSynergy/fs-objects", tag = "v0.0.1" }
fs-types = { git = "https://github.com/FreeSynergy/fs-interfaces", tag = "v0.0.2" }
# provisional: the generated Admin frontend at its reviewed commit; becomes a tag once Strategy tags it
fs-admin-frontend = { git = "https://github.com/FreeSynergy/fs-components", rev = "5809e893a5d1447e18802188f8d3640bcb7a70d6" }
fs-components-app = { git = "https://github.com/FreeSynergy/fs-components", rev = "5809e893a5d1447e18802188f8d3640bcb7a70d6" }
fs-components-fields = { git = "https://github.com/FreeSynergy/fs-components", rev = "5809e893a5d1447e18802188f8d3640bcb7a70d6" }
fs-components-styles = { git = "https://github.com/FreeSynergy/fs-components", rev = "5809e893a5d1447e18802188f8d3640bcb7a70d6" }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
getrandom = "0.3"
tokio = { version = "1", features = ["rt-multi-thread"] }

[dev-dependencies]
fs-messenger-core = { path = "../fs-messenger-core", features = ["test-support"] }
tokio = { version = "1", features = ["full"] }
