[package]
name = "fs-messenger-ai"
description = "AI model provider of FreeSynergy.Messenger: llama.cpp HTTP API and Anthropic Messages API behind the core's Provider trait"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# Lets a build trust exactly one given certificate, for a self-signed scripted server in the tests. Off
# in every normal build, so a program cannot even name the option. Never a general "accept invalid".
test-trust = []

[dependencies]
fs-messenger-core = { path = "../fs-messenger-core" }
fs-messenger-guard = { path = "../fs-messenger-guard" }
fs-objects = { git = "https://github.com/FreeSynergy/fs-objects", tag = "v0.0.1" }
fs-interfaces = { git = "https://github.com/FreeSynergy/fs-interfaces", tag = "v0.0.1" }

# rustls with ring, no OpenSSL, no native-tls; no gzip, no cookies, no HTTP/2. As in fs-messenger-mail.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"

async-trait = "0.1"
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
zeroize = "1"

[dev-dependencies]
# The test-only trust option, for the tests over real TLS.
fs-messenger-ai = { path = ".", features = ["test-trust"] }
ed25519-compact = { version = "2.6", default-features = false, features = ["std"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
